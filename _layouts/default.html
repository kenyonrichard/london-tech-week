<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ page.title }}</title>
        <meta name="description" content="{{ page.description | escape }}" />
        <meta name="author" content="{{ site.author }}" />
        <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="{{ site.title | escape }}" />
        <meta property="og:title" content="{{ page.title | escape }}" />
        <meta property="og:description" content="{{ page.description | escape }}" />
        <meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}" />
        <meta property="og:image" content="{{ page.image | default: '/images/web/core-stage-in-session.jpg' | absolute_url }}" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="theme-color" content="#0a192f" />
        <link rel="stylesheet" href="{{ page.root }}css/style.css" />
        <link rel="icon" type="image/x-icon" href="{{ page.root }}favicon.ico" />
        <link rel="icon" type="image/png" sizes="32x32" href="{{ page.root }}images/favicon/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="{{ page.root }}images/favicon/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="{{ page.root }}images/favicon/apple-touch-icon.png" />
        <script src="{{ page.root }}js/site.js" defer></script>
    </head>
    <body>
{% include header.html root=page.root active=page.active %}

{{ content }}

{% include footer.html root=page.root %}
    </body>
</html>
